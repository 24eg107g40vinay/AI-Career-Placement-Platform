spring.application.name=career-placement-platform
server.port=8080
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Local development fallback only. Set JWT_SECRET to a private Base64 secret outside local development.
app.jwt.secret=${JWT_SECRET}
app.upload-dir=${UPLOAD_DIR:uploads/resumes}
app.resume.max-size-bytes=${RESUME_MAX_SIZE_BYTES:5242880}
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.sample-data.enabled=${SAMPLE_DATA_ENABLED:false}
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.name=${ADMIN_BOOTSTRAP_NAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
